name: Reconcile TODO README
on:
  push:
    branches: [dev]
    paths: ['.github/workflows/reconcile-todos.yml']
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - name: Scan Python TODOs and update README
        shell: bash
        run: |
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          ROOT = Path.cwd()
          README = ROOT / 'README.md'
          TITLE = '### 📝 Complete TODO List'
          ROW = re.compile(r'^- \[ \] \*\*(.+?):(\d+)\*\* - (.*)$')
          TODO = re.compile(r'^\s*#\s*TODO\b(.*)$')

          def git(*args):
              return subprocess.check_output(['git', *args], text=True)

          def parse_source(source):
              result = []
              for line_number, line in enumerate(source.splitlines(), 1):
                  match = TODO.match(line)
                  if not match:
                      continue
                  remainder = match.group(1)
                  if remainder.startswith(':'):
                      remainder = remainder[1:]
                  result.append((line_number, remainder.strip()))
              return result

          def extract_path(path, source=None):
              if source is None:
                  source = (ROOT / path).read_text(encoding='utf-8')
              return [(path, line, text) for line, text in parse_source(source)]

          def read_readme():
              text = README.read_text(encoding='utf-8')
              assert '\r' not in text, 'Unexpected CRLF in README'
              lines = text.splitlines()
              start = lines.index(TITLE)
              end = next(i for i in range(start + 1, len(lines)) if lines[i].startswith('## '))
              rows = []
              for index in range(start + 1, end):
                  match = ROW.match(lines[index])
                  if match:
                      rows.append({
                          'index': index,
                          'path': match.group(1),
                          'line': int(match.group(2)),
                          'text': match.group(3),
                          'raw': lines[index],
                      })
              return text, lines, start, end, rows

          old_text, old_lines, start, end, baseline = read_readme()
          baseline_keys = [(r['path'], r['line'], r['text']) for r in baseline]
          assert len(baseline_keys) == len(set(baseline_keys)), 'Duplicateplicate baseline rows'
          assert baseline_keys == sorted(baseline_keys, key=lambda r: (r[0], r[1])), 'Baseline is not path/line sorted'

          main_py = [p for p in git('ls-tree', '-r', '--name-only', 'origin/main').splitlines() if p.endswith('.py')]
          main_all = []
          for path in main_py:
              main_all.extend(extract_path(path, git('show', f'origin/main:{path}')))
          dev_py = sorted(
              p.relative_to(ROOT).as_posix()
              for p in ROOT.rglob('*.py')
              if '.git' not in p.relative_to(ROOT).parts
          )
          dev_all = []
          for path in dev_py:
              dev_all.extend(extract_path(path))
          print(f'Full Python scan: main={len(main_py)} files/{len(main_all)} TODOs; dev={len(dev_py)} files/{len(dev_all)} TODOs')
          print(f'README baseline: {len(baseline)} rows; exact full-main match={baseline_keys == main_all}')

          changed = sorted(git('diff', '--name-only', 'origin/main..HEAD', '--', '*.py').splitlines())
          expected_changed = {
              'luffy/deepscaler/utils.py',
              'luffy/verl/verl/protocol.py',
          }
          assert set(changed) == expected_changed, f'Unexpected changed Python files: {changed}'
          print('Main-to-dev Python changes:', changed)

          by_path = {}
          for row in baseline:
              by_path.setdefault(row['path'], []).append(row)

          replacements = {}
          removed = 0
          for path in changed:
              old_source = git('show', f'origin/main:{path}')
              main_entries = extract_path(path, old_source)
              baseline_entries = [(r['path'], r['line'], r['text']) for r in by_path.get(path, [])]
              assert main_entries == baseline_entries, f'Main parser/baseline mismatch for {path}:\nmain={main_entries}\nbaseline={baseline_entries}'
              new_entries = extract_path(path)
              replacements[path] = new_entries
              removed += len(main_entries) - len(new_entries)
              print(f'{path}: {len(main_entries)} -> {len(new_entries)} TODOs')

          expected_lines = {
              'luffy/deepscaler/utils.py': [45, 46, 47, 107, 108, 109, 110, 111, 112, 113, 114],
              'luffy/verl/verl/protocol.py': [114, 115, 136, 137, 169, 265, 351],
          }
          for path, entries in replacements.items():
              assert [line for _, line, _ in entries] == expected_lines[path], (path, entries)
          assert removed == 11, f'Expected 11 completed TODO removals, got {removed}'

          new_section = []
          inserted = set()
          for index in range(start + 1, end):
              line = old_lines[index]
              match = ROW.match(line)
              path = match.group(1) if match else None
              if path in replacements:
                  if path not in inserted:
                      for entry_path, line_number, text in replacements[path]:
                          new_section.append(f'- [ ] **{entry_path}:{line_number}** - {text}')
                      inserted.add(path)
                  continue
              new_section.append(line)
          assert inserted == set(changed), 'A changed file had no baseline group and was not inserted'

          new_lines = old_lines[:start + 1] + new_section + old_lines[end:]
          new_text = '\n'.join(new_lines) + ('\n' if old_text.endswith('\n') else '')
          assert new_lines[:start + 1] == old_lines[:start + 1]
          assert new_lines[start + 1 + len(new_section):] == old_lines[end:]

          new_start = new_lines.index(TITLE)
          new_end = next(i for i in range(new_start + 1, len(new_lines)) if new_lines[i].startswith('## '))
          final_rows = []
          for line in new_lines[new_start + 1:new_end]:
              match = ROW.match(line)
              if match:
                  final_rows.append((match.group(1), int(match.group(2)), match.group(3)))
          assert len(final_rows) == len(baseline) - 11
          assert final_rows == sorted(final_rows, key=lambda r: (r[0], r[1]))
          assert new_text.count(TITLE) == 1
          README.write_text(new_text, encoding='utf-8', newline='')
          print(f'Final README: {len(final_rows)} rows; removed=11; all rows sorted; title and surrounding sections preserved')
          PY
      - name: Commit README and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git rm .github/workflows/reconcile-todos.yml
          git commit -m 'docs: reconcile TODO list with dev implementation'
          git push origin HEAD:dev
